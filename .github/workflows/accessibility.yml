name: Accessibility

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 9am UTC
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # npx (not pnpm dlx) — pnpm dlx skips postinstall scripts by default,
      # which breaks chromedriver's binary download (ENOENT at run time).
      # This step doesn't touch the project's own deps, so no checkout/pnpm
      # install needed.
      - name: axe-core scan
        continue-on-error: true
        run: |
          npx --yes @axe-core/cli \
            https://pelicoolas.vercel.app/ \
            https://pelicoolas.vercel.app/search \
            https://pelicoolas.vercel.app/watchlist \
            --chrome-options=no-sandbox,headless
